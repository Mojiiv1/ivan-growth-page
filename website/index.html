};
const ROUTES=['home','services','bridal','gallery','locations'];
const state={lang:'en',page:'home'};
const el=id=>document.getElementById(id);
function href(page=state.page,lang=state.lang){return `#/${lang}/${page}`}
function navHtml(mobile=false){const t=CONTENT[state.lang];return ROUTES.map((p,i)=>`<a href="${href(p)}" ${p===state.page?'aria-current="page"':''}>${t.nav[i]}</a>`).join('')+(mobile?`<a class="pill-link" href="${BASE}" target="_blank" rel="noopener noreferrer">${t.book} ↗</a>`:'')}
function book(t,css='pill-link'){return `<a class="${css}" href="${BASE}" target="_blank" rel="noopener noreferrer">${t.book} <span aria-hidden="true">↗</span></a>`}
function btn(text,url,css='outline-link'){return `<a class="${css}" href="${url}">${text} <span aria-hidden="true">↗</span></a>`}
function img(n,extra=''){return `<img src="${IMG(n)}" alt="Ivan Beauty Salon portfolio photo ${n}" width="800" height="950" ${extra}>`}
function top(eye,title,lead){return `<section class="page-intro"><div class="wrap"><p class="eyebrow">${eye}</p><h1>${title}</h1><p class="section-intro">${lead}</p></div></section>`}
function cardLocations(t){return `<div class="locations-grid">${[WOOD,HEM].map((loc,i)=>`<article class="location-card"><div class="location-img location-branded"><img src="assets/ivan-logo-transparent.svg" alt="" width="450" height="245" loading="lazy"></div><div class="location-info"><p class="eyebrow">Ottawa / 0${i+1}</p><h3>${loc.title}</h3><address>${loc.address}</address><a href="tel:${loc.tel}">${loc.phone}</a><div class="cta-row">${btn(t.directions,loc.map)}${btn(t.call,`tel:${loc.tel}`)}</div></div></article>`).join('')}</div>`}
function finalCta(t){return `<section class="final-cta"><div class="wrap inner"><div><p class="eyebrow">${t.ctaEye}</p><h2>${t.ctaTitle}</h2><p>${t.ctaText}</p></div>${book(t)}</div></section>`}
function home(t){const d=t.home;return `<section class="hero"><div class="wrap hero-inner"><div class="hero-copy"><p class="eyebrow">${d.eyebrow}</p><h1>${d.headline}</h1><p class="lead">${d.lead}</p><div class="cta-row">${book(t)}${btn(t.servicesBtn,href('services'))}</div><div class="hero-stroke" aria-hidden="true"></div></div><div class="hero-image">${img(5)}</div></div></section>
<section class="feature-strip"><div class="wrap feature-inner">${d.feature.map(x=>`<div class="feature"><span class="symbol" aria-hidden="true">${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div></section>
<section class="section wrap" id="services-preview"><div class="section-top"><p class="eyebrow">${t.nav[1]}</p><h2 class="section-title">${d.servicesTitle}</h2><p class="section-intro">${d.servicesText}</p></div><div class="service-grid">${d.cards.map((x,i)=>`<article class="service-card">${img([1,2,3,4][i],'loading="lazy"')}<div class="service-content"><h3>${x[0]}</h3><p>${x[1]}</p>${btn(t.more,href(i===3?'bridal':'services'),'text-more')}</div></article>`).join('')}</div></section>
<section class="section highlight"><div class="wrap inner">${img(1,'loading="lazy"')}<div><p class="eyebrow">${d.privateEye}</p><h2>${d.privateTitle}</h2><p>${d.privateText}</p><div class="cta-row">${btn(t.servicesBtn,href('services'))}</div></div></div></section>
<section class="section wrap"><div class="section-top"><p class="eyebrow">${d.locationEye}</p><h2 class="section-title">${d.locationTitle}</h2><p class="section-intro">${d.locationText}</p></div>${cardLocations(t)}</section>
<section class="section" style="background:#f5ead6"><div class="wrap"><div class="section-top"><p class="eyebrow">${d.galleryEye}</p><h2 class="section-title">${d.galleryTitle}</h2><p class="section-intro">${d.galleryText}</p></div><div class="gallery-grid">${[1,2,3,4,5].map(i=>`<a href="${href('gallery')}" aria-label="${t.galleryBtn}">${img(i,'loading="lazy"')}</a>`).join('')}</div><div class="gallery-cta">${btn(t.galleryBtn,href('gallery'))}</div></div></section>
<section class="section faq-section"><div class="wrap faq-wrap"><p class="eyebrow">${d.faqEye}</p><h2>${d.faqTitle}</h2>${d.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></section>${finalCta(t)}`}
function services(t){const d=t.services;return top(d.eye,d.title,d.intro)+`<section class="section wrap"><div class="service-detail-grid">${d.groups.map((x,i)=>`<article class="content-panel"><p class="eyebrow">0${i+1}</p><h2>${x[0]}</h2><p>${x[1]}</p></article>`).join('')}</div><div class="info-note">${d.notice}</div></section><section class="section" style="background:#f1e5ce"><div class="wrap"><div class="section-top"><p class="eyebrow">Hemlock · Ottawa</p><h2 class="section-title">${d.priceTitle}</h2><p class="section-intro">${d.priceInfo}</p></div><div class="content-panel" style="max-width:900px;margin:auto"><table class="pricing"><tbody>${d.prices.map(([name,price])=>`<tr><th scope="row">${name}</th><td>${price}</td></tr>`).join('')}</tbody></table><p class="price-foot">${d.notice}</p><div class="cta-row">${book(t)}${btn(d.official,'https://ivanbeauty.com/services/')}</div></div></div></section>${finalCta(t)}`}
function bridal(t){const d=t.bridal;return top(d.eye,d.title,d.intro)+`<section class="section wrap"><div class="bridal-layout"><div>${img(1)}</div><div><p class="eyebrow">${d.subTitle}</p><h2>${d.subTitle}</h2><p>${d.description}</p><ul>${d.list.map(x=>`<li>${x}</li>`).join('')}</ul><div class="cta-row">${book(t)}</div></div></div></section><section class="section" style="background:#f2e7d3"><div class="wrap"><div class="section-top"><p class="eyebrow">IVAN BEAUTY SALON</p><h2 class="section-title">${d.prices}</h2></div><div class="content-panel" style="max-width:900px;margin:auto"><table class="pricing"><tbody>${d.priceList.map(([name,value])=>`<tr><th scope="row">${name}</th><td>${value}</td></tr>`).join('')}</tbody></table><p style="margin-top:18px;font-size:.9rem">${d.notice}</p></div></div></section>${finalCta(t)}`}
function gallery(t){const d=t.gallery;return top(d.eye,d.title,d.intro)+`<section class="section wrap"><div class="gallery-page">${[1,2,3,4,5].map((n,i)=>`<figure>${img(n,'loading="lazy"')}<figcaption>${d.captions[i]}</figcaption></figure>`).join('')}</div><div class="cta-row">${btn('Instagram ↗','https://www.instagram.com/ivanbeautysalon/')}</div></section>${finalCta(t)}`}
function locations(t){const d=t.locations;return top(d.eye,d.title,d.intro)+`<section class="section wrap"><div class="locations-grid">${[WOOD,HEM].map((loc,i)=>`<article class="location-card"><div class="location-img location-branded"><img src="assets/ivan-logo-transparent.svg" alt="" width="450" height="245" loading="lazy"></div><div class="location-info"><p class="eyebrow">Ottawa / 0${i+1}</p><h3>${loc.title}</h3><address>${loc.address}</address><a href="tel:${loc.tel}">${loc.phone}</a><div class="cta-row">${btn(t.directions,loc.map)}${btn(t.call,`tel:${loc.tel}`)}</div><h4 style="margin:24px 0 0">${d.hours}</h4><ul class="hours">${d.days.map((day,j)=>`<li><span>${day}</span><span>${(i?d.hoursHem:d.hoursWood)[j]}</span></li>`).join('')}</ul><p style="font-size:.82rem">${d.hoursNote}</p></div></article>`).join('')}</div><div class="info-note">${d.contact}</div></section><section class="section" style="background:#f2e7d3"><div class="wrap"><div class="content-panel" style="max-width:950px;margin:auto"><h2>${d.policyTitle}</h2><p>${d.policyText}</p><div class="cta-row">${book(t)}</div></div></div></section>${finalCta(t)}`}
function render(){const match=location.hash.match(/^#\/(en|fr|ar)\/(home|services|bridal|gallery|locations)$/);if(match){state.lang=match[1];state.page=match[2]}else{try{state.lang=localStorage.getItem('ivan-site-lang')||'en'}catch{state.lang='en'}state.page='home';if(!CONTENT[state.lang])state.lang='en'}const t=CONTENT[state.lang];document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';document.title=`${t.nav[ROUTES.indexOf(state.page)]} | Ivan Beauty Salon — Demo`;el('skip').textContent=t.skip;el('demo-banner').textContent=t.demo;el('brand').href=href('home');el('desktop-nav').innerHTML=navHtml();el('mobile-nav').innerHTML=navHtml(true);el('header-book').textContent=t.book+' ↗';el('lang-picker').innerHTML=['en','fr','ar'].map((lang,i)=>`<button type="button" data-lang="${lang}" lang="${lang}" aria-pressed="${String(lang===state.lang)}">${['EN','FR','العربية'][i]}</button>`).join('');el('lang-picker').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{try{localStorage.setItem('ivan-site-lang',btn.dataset.lang)}catch{}location.hash=href(state.page,btn.dataset.lang)}));el('menu-toggle').setAttribute('aria-label',t.menu);el('main').innerHTML=({home,services,bridal,gallery,locations})[state.page](t);el('footer').innerHTML=`<div class="wrap"><div class="inner"><div class="footer-brand"><img src="assets/ivan-logo-transparent.svg" width="450" height="245" alt="Ivan Beauty Salon"><p>${t.footerCopy}</p></div><div><h3>${t.footerLinks}</h3>${ROUTES.map((p,i)=>`<a href="${href(p)}">${t.nav[i]}</a>`).join('')}</div><div><h3>${t.footerContact}</h3><a href="tel:${WOOD.tel}">Woodroffe · ${WOOD.phone}</a><a href="tel:${HEM.tel}">Hemlock · ${HEM.phone}</a><a href="https://www.instagram.com/ivanbeautysalon/" target="_blank" rel="noopener noreferrer">Instagram ↗</a><a href="https://ivanbeauty.com/" target="_blank" rel="noopener noreferrer">ivanbeauty.com ↗</a></div></div><div class="footer-bottom"><span>${t.footerNote}</span><span>© 2026 Tap &amp; Grow Ottawa · Demo</span></div></div>`;el('mobile-nav').classList.remove('open');el('menu-toggle').setAttribute('aria-expanded','false');el('menu-toggle').textContent='☰'}
el('menu-toggle').addEventListener('click',()=>{const nav=el('mobile-nav');const open=!nav.classList.contains('open');nav.classList.toggle('open',open);el('menu-toggle').setAttribute('aria-expanded',String(open));el('menu-toggle').setAttribute('aria-label',open?CONTENT[state.lang].close:CONTENT[state.lang].menu);el('menu-toggle').textContent=open?'✕':'☰'});window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});el('main').focus({preventScroll:true})});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('mobile-nav').classList.contains('open')){el('menu-toggle').click();el('menu-toggle').focus()}});render();
</script>
</body></html>
